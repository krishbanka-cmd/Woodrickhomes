<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Woodrick Homes | Product Media Library</title>
<style>
:root{--ink:#151515;--gold:#b78a3b;--gold2:#d7b36a;--cream:#f7f3ec;--muted:#6d6a65;--line:#e7e1d7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}
.wrap{width:min(1120px,92%);margin:auto}.top{background:#0b0b0b;color:#fff;padding:20px 0}.brand{font-weight:800;letter-spacing:2px}.brand span{color:var(--gold2)}
.hero{padding:70px 0 34px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:3px;color:var(--gold);font-weight:700}.hero h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,64px);font-weight:500;margin:10px 0}.hero p{max-width:760px;color:var(--muted);font-size:17px;line-height:1.7}.actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px}.link{color:var(--gold);font-weight:700;text-decoration:none}.admin{background:#111;color:var(--gold2);padding:11px 15px;border-radius:6px;text-decoration:none;font-weight:800}
#state{padding:24px 0;color:var(--muted)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:10px 0 70px}.card{background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.06);overflow:hidden}.thumb{aspect-ratio:4/3;background:#ebe7df;display:flex;align-items:center;justify-content:center;color:#8b857d}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:20px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-weight:800}.card h2{font-family:Georgia,serif;font-weight:500;font-size:27px;margin:9px 0}.card p{color:var(--muted);font-size:14px;line-height:1.6;min-height:46px}.media{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.media a{display:inline-block;background:#111;color:#fff;text-decoration:none;padding:9px 12px;border-radius:5px;font-size:13px;font-weight:700}.empty{background:#fff;border:1px solid var(--line);padding:30px;margin-bottom:60px}.empty strong{color:var(--gold)}
@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.products{grid-template-columns:1fr}.hero{padding-top:48px}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="brand">WOODRICK <span>HOMES</span></div></div></div>
<main class="wrap">
<section class="hero"><div class="kicker">Product Media Library</div><h1>Products & Catalogues</h1><p>Browse product photos, videos and PDF catalogues uploaded by Woodrick Homes.</p><div class="actions"><a class="link" href="/">← Back to Woodrick Homes</a><a class="admin" href="/admin/">ADMIN · ADD PRODUCT</a></div></section>
<div id="state">Loading products…</div><section id="products" class="products" hidden></section>
</main>
<script>
const state=document.getElementById('state'),grid=document.getElementById('products');
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const r=await fetch('/api/products');const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to load products');const items=data.products||[];if(!items.length){state.innerHTML='<div class="empty"><strong>No uploaded products yet.</strong><br>Use the Admin · Add Product button to add the first product after Cloudflare R2 storage is connected.</div>';return}state.hidden=true;grid.hidden=false;grid.innerHTML=items.map(p=>{const img=p.images&&p.images[0]?`<img src="${esc(p.images[0])}" alt="${esc(p.name)}">`:'Product image';const media=[p.pdf?`<a href="${esc(p.pdf)}" target="_blank" rel="noopener">PDF Catalogue</a>`:'',p.video?`<a href="${esc(p.video)}" target="_blank" rel="noopener">Watch Video</a>`:'',p.videoUrl?`<a href="${esc(p.videoUrl)}" target="_blank" rel="noopener">Video Link</a>`:''].join('');return `<article class="card"><div class="thumb">${img}</div><div class="body"><div class="tag">${esc(p.category)}</div><h2>${esc(p.name)}</h2><p>${esc(p.description||'Product details available from Woodrick Homes.')}</p><div class="media">${media}</div></div></article>`}).join('')}catch(e){state.innerHTML='<div class="empty"><strong>Product storage is not connected yet.</strong><br>'+esc(e.message)+'</div>'}}
load();
</script>
</body></html>
