<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woodrick Library Admin</title>
<style>
:root{--black:#070707;--gold:#f0c96b;--cream:#f7f3ec;--line:#ded4c7;--ink:#211b16;--muted:#746b62}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}.top{background:var(--black);color:var(--gold);padding:14px 5%;font-weight:900}.wrap{width:min(900px,92%);margin:auto;padding:30px 0 60px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}.card h1,.card h2{font-family:Georgia,serif;font-weight:500}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:7px;font:inherit}.btn{width:100%;padding:14px;border:1px solid #b88b42;border-radius:7px;background:var(--black);color:var(--gold);font-weight:900;cursor:pointer}.btn:disabled{opacity:.5}.status{margin-top:14px;padding:12px;background:#faf5e9;border-left:3px solid #c79a45;font-size:13px;line-height:1.5}.progress{height:10px;background:#eee3d4;border-radius:999px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#b88b42;transition:.2s}.note{font-size:12px;color:var(--muted);line-height:1.6}.list{display:grid;gap:10px;margin-top:14px}.item{border:1px solid var(--line);padding:12px;border-radius:9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.actions a{padding:8px 10px;border:1px solid #b88b42;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
</head>
<body>
<div class="top">WOODRICK HOME LIBRARY · ADMIN</div>
<main class="wrap">
<section class="card"><h1>Upload PDF → Save Original + Convert to JPG</h1><p class="note">Original PDF R2 storage me safe rahega. Har page browser me JPG me convert hoke alag JPG folder me upload hoga. Admin access code required hai.</p>
<div class="grid"><div><label>ADMIN ACCESS CODE</label><input id="token" type="password" placeholder="Admin code"></div><div><label>BRAND</label><input id="brand" value="Woodrick"></div><div><label>CATEGORY</label><select id="category"><option>Laminate</option><option>Plywood</option><option>Louvers</option><option>Acrylic</option><option>Hardware</option><option>Tiles</option><option>Furniture</option><option>Other</option></select></div><div><label>CATALOGUE NAME</label><input id="catalogue" placeholder="Example: Merino 2026 Collection"></div><div class="full"><label>PDF FILE</label><input id="pdf" type="file" accept="application/pdf"></div></div>
<button class="btn" id="start" type="button">UPLOAD PDF & CONVERT TO JPG</button><div class="progress"><div class="bar" id="bar"></div></div><div class="status" id="status">Ready.</div></section>
<section class="card"><h2>Saved Catalogues</h2><button class="btn" id="refresh" type="button">REFRESH LIBRARY LIST</button><div class="list" id="list"></div></section>
</main>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;
async function uploadFile(file,meta){const fd=new FormData();fd.append('file',file);Object.entries(meta).forEach(([k,v])=>fd.append(k,v));const r=await fetch('/api/upload',{method:'POST',headers:{authorization:'Bearer '+$('token').value.trim()},body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Upload failed');return d}
$('start').addEventListener('click',async()=>{const file=$('pdf').files[0],catalogue=$('catalogue').value.trim(),brand=$('brand').value.trim(),category=$('category').value,token=$('token').value.trim();if(!token||!file||!catalogue){status('Admin code, catalogue name aur PDF required hai.');return}if(file.type!=='application/pdf'){status('Please select a PDF file.');return}$('start').disabled=true;$('bar').style.width='2%';try{status('Original PDF upload ho raha hai…');await uploadFile(file,{library:'1',brand,category,catalogue,title:catalogue,type:'original-pdf'});const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;status(`PDF saved. ${pdf.numPages} pages JPG me convert ho rahe hain…`);for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const viewport=page.getViewport({scale:1.7});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.88));const jpg=new File([blob],`page-${String(i).padStart(3,'0')}.jpg`,{type:'image/jpeg'});await uploadFile(jpg,{library:'1',brand,category,catalogue,title:`${catalogue} page ${i}`,type:'jpg-page',page:String(i)});$('bar').style.width=Math.round(5+95*i/pdf.numPages)+'%';status(`Page ${i}/${pdf.numPages} converted and saved…`);canvas.width=1;canvas.height=1}status(`Done: Original PDF + ${pdf.numPages} JPG pages saved successfully.`);await loadList()}catch(e){status('Error: '+e.message)}finally{$('start').disabled=false}});
async function loadList(){try{const r=await fetch('/api/media?prefix=library/');const d=await r.json();const groups={};(d.items||[]).forEach(x=>{const key=[x.brand||'Woodrick',x.category||'Other',x.catalogue||'Catalogue'].join('||');groups[key]??={brand:x.brand||'Woodrick',category:x.category||'Other',catalogue:x.catalogue||'Catalogue',pdf:null,jpg:[]};if(x.type==='original-pdf')groups[key].pdf=x;else if(x.type==='jpg-page')groups[key].jpg.push(x)});const rows=Object.values(groups).sort((a,b)=>a.catalogue.localeCompare(b.catalogue));$('list').innerHTML=rows.length?rows.map(g=>`<div class="item"><b>${g.catalogue}</b><br>${g.brand} · ${g.category} · ${g.jpg.length} JPG pages<div class="actions">${g.pdf?`<a href="${g.pdf.url}&download=1">Download PDF</a>`:''}<a href="woodrick-library.html?q=${encodeURIComponent(g.catalogue)}">Open Library</a></div></div>`).join(''):'No library catalogues uploaded yet.'}catch(e){$('list').textContent='Could not load library: '+e.message}}
$('refresh').addEventListener('click',loadList);loadList();
</script>
</body></html>
