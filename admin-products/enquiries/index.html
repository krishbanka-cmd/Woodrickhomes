<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Website Enquiries | Woodrick Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f3ec;color:#1c1b1b;font:15px Arial,sans-serif}header{background:#080808;color:#f0c96b;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}a{color:inherit}main{max-width:1100px;margin:auto;padding:28px 20px}h1{font:36px Georgia,serif;margin:0 0 9px}p{line-height:1.5}button{border:0;background:#191919;color:#f0c96b;padding:11px 16px;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.5}.card{background:white;border:1px solid #ded4c3;margin:14px 0;padding:18px;overflow-wrap:anywhere}.card h2{font-size:19px;margin:0 0 8px}.card p{margin:7px 0}</style></head>
<body><header><strong>WOODRICK HOMES · ENQUIRIES</strong><a href="/admin-products/">← Admin</a></header><main><h1>Website Enquiries</h1><p>Website par received enquiries. Google Sheet delivery alag integration hai; yahaan Woodrick ka saved record dikh raha hai.</p><button id="refresh" type="button">Refresh</button><p id="status" role="status">Loading…</p><div id="items"></div><button id="more" type="button" hidden>Load more</button></main>
<script>
const list=document.getElementById('items'),status=document.getElementById('status'),more=document.getElementById('more');let cursor='',busy=false;
function line(label,value){const p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=label+': ';p.append(strong,document.createTextNode(value||'—'));return p}
function card(item){const node=document.createElement('article'),heading=document.createElement('h2');node.className='card';heading.textContent=item.name||'Enquiry';node.append(heading,line('Mobile',item.mobile),line('Email',item.email),line('City',item.city),line('Requirement',item.requirement),line('Message',item.message),line('Reference',item.id),line('Received',item.createdAt));if(item.attachmentId)node.append(line('Attachment reference',item.attachmentId));return node}
async function load(reset=false){if(busy)return;busy=true;more.disabled=true;if(reset){cursor='';list.replaceChildren()}status.textContent='Loading…';try{const response=await fetch('/api/enquiries'+(cursor?'?cursor='+encodeURIComponent(cursor):''),{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'Could not load enquiries');for(const item of data.items)list.append(card(item));cursor=data.cursor||'';more.hidden=!cursor;status.textContent=list.children.length+' enquiry(s) shown'+(cursor?' · more available':'')}catch(error){status.textContent=error.message||'Please retry'}finally{busy=false;more.disabled=false}}
document.getElementById('refresh').onclick=()=>load(true);more.onclick=()=>load();load(true);
</script></body></html>
