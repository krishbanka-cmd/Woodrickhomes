<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Applications | Woodrick Homes Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#111116;color:#f3ede4;font:15px Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #6c5831;padding:20px max(20px,calc((100vw - 1000px)/2))}h1{font:32px Georgia,serif;margin:0}a{color:#e7c478}main{max-width:1000px;padding:28px 20px;margin:auto}button{background:#d9ac55;border:0;padding:10px 14px;font-weight:700;cursor:pointer}select{padding:9px;background:#222;color:#fff;border:1px solid #977a4c}article{border:1px solid #6f5d40;background:#1d1d20;padding:20px;margin:16px 0}h2{font-size:19px;margin:0 0 12px}p{line-height:1.5;color:#d4c8b8}b{color:#edce89}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:15px}#status{color:#e9ca83}@media(max-width:600px){.meta{grid-template-columns:1fr}h1{font-size:24px}}</style></head><body><header><h1>Vendor Applications</h1><a href="/admin-products/">← Products Admin</a></header><main><p>New suppliers ki details aur documents review karein. Approval sirf internal status hai; public product listing ya vendor login abhi activate nahi hota.</p><button id="refresh">Refresh applications</button> <span id="status" role="status"></span><div id="items"></div></main><script>const list=document.getElementById('items'),status=document.getElementById('status');function el(tag,text){const node=document.createElement(tag);node.textContent=text||'';return node}function field(box,label,value){const item=el('div');const title=el('b',label+': ');item.append(title,document.createTextNode(value||'—'));box.append(item)}async function load(){status.textContent='Loading…';list.replaceChildren();try{const r=await fetch('/api/vendor-applications',{cache:'no-store'});if(r.status===401){location.href='/admin-products/';return}const data=await r.json();if(!r.ok)throw Error(data.error||'Unable to load');status.textContent=data.items.length+' application(s)'+(data.truncated?' · showing latest 100':'');for(const v of data.items){const card=el('article'),h=el('h2',v.business),meta=el('div');meta.className='meta';field(meta,'Contact',v.contact);field(meta,'Mobile',v.mobile);field(meta,'City',v.city);field(meta,'Category',v.category);field(meta,'GSTIN',v.gst);field(meta,'Received',new Date(v.createdAt).toLocaleString());field(meta,'Status',v.status);card.append(h,meta);if(v.note)card.append(el('p',v.note));const actions=el('div');actions.className='actions';if(v.documentKey){const link=el('a','Download document ↗');link.href='/api/vendor-applications/file?id='+encodeURIComponent(v.id);link.target='_blank';link.rel='noopener';actions.append(link)}const select=el('select');for(const s of ['pending','approved','rejected']){const o=el('option',s);o.value=s;if(v.status===s)o.selected=true;select.append(o)}const btn=el('button','Save status');btn.onclick=async()=>{btn.disabled=true;try{const r=await fetch('/api/vendor-applications/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:v.id,status:select.value})});const d=await r.json();if(!r.ok)throw Error(d.error);await load()}catch(e){status.textContent=e.message||'Save failed'}finally{btn.disabled=false}};actions.append(select,btn);card.append(actions);list.append(card)}}catch(e){status.textContent=e.message||'Unable to load'}}document.getElementById('refresh').onclick=load;load();</script></body></html>
