<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Management | Woodrick Homes</title><style>:root{--black:#050505;--gold:#f0c96b;--cream:#f7f3ec;--line:#ded4c3;--muted:#6d675e;--red:#9b2929;--green:#226c45}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#171717;font-family:Arial,sans-serif}.top{background:var(--black);color:#fff;border-bottom:2px solid var(--gold)}.wrap{width:min(1160px,94%);margin:auto}.top .wrap{min-height:74px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.brand b{color:var(--gold)}a{color:var(--gold);font-size:12px;font-weight:900;text-decoration:none;margin-left:15px}.hero{padding:35px 0 15px}.hero h1{font:500 clamp(36px,5vw,52px) Georgia,serif;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.55}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filter,.btn{padding:11px 14px;border:1px solid #b88b42;background:#fff;color:#604716;font-weight:900;cursor:pointer}.filter.active{background:#111;color:var(--gold)}.list{display:grid;gap:13px;margin-bottom:40px}.card{background:#fff;border:1px solid var(--line);padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px}.card h2{font:500 24px Georgia,serif;margin:0 0 7px}.meta{font-size:13px;line-height:1.65;color:#514a40}.badge{display:inline-block;padding:5px 8px;background:#fff0bd;color:#765313;font-size:10px;font-weight:900;margin-left:8px}.badge.approved{background:#e9f7ef;color:var(--green)}.badge.rejected,.badge.suspended{background:#fff0f0;color:var(--red)}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.approve{background:#e9f7ef;color:var(--green);border-color:var(--green)}.reject,.suspend{color:var(--red);border-color:var(--red)}.empty{padding:28px;background:#fff;border:1px solid var(--line);color:var(--muted)}@media(max-width:720px){.card{grid-template-columns:1fr}.actions{justify-content:flex-start}.top .wrap{align-items:flex-start;padding:18px 0;gap:12px}.top .wrap>div:last-child{display:grid;gap:8px}.top a{margin:0}}</style></head><body><header class="top"><div class="wrap"><div class="brand"><b>WOODRICK</b> HOMES · ADMIN</div><div><a href="/vendor-register.html?source=admin">+ ADD VENDOR</a><a href="/admin-products/">PRODUCT MANAGER</a><a href="/admin-logout">LOG OUT</a></div></div></header><section class="hero"><div class="wrap"><h1>Vendor Management</h1><div class="sub">Review OTP-verified registrations before vendor dashboard access is activated.</div><div class="filters"><button class="filter active" data-status="all">ALL</button><button class="filter" data-status="pending">PENDING</button><button class="filter" data-status="correction_required">CORRECTION REQUIRED</button><button class="filter" data-status="approved">APPROVED</button><button class="filter" data-status="rejected">REJECTED</button><button class="filter" data-status="suspended">SUSPENDED</button></div></div></section><main class="wrap"><div id="list" class="list"><div class="empty">Loading vendor registrations…</div></div></main><script>const $=id=>document.getElementById(id);let vendors=[],filter='all';function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(v){return String(v||'').replaceAll('_',' ').toUpperCase()}function render(){const a=vendors.filter(v=>filter==='all'||v.status===filter);$('list').innerHTML=a.length?a.map(v=>`<article class="card"><div><h2>${esc(v.company)} <span class="badge ${esc(v.status)}">${esc(label(v.status))}</span></h2><div class="meta"><b>${esc(v.category)}</b> · ${esc(v.contact)}<br>+91 ${esc(v.phone)} · ${esc(v.email)}${v.gst?'<br>GSTIN: '+esc(v.gst):''}${v.pan?'<br>PAN: '+esc(v.pan):''}${v.address?'<br>Address: '+esc(v.address):''}<br>Registration: ${v.registrationSource==='admin'?'Woodrick Admin':'Vendor Link'} · Mobile verified<br>Registered: ${new Date(v.createdAt).toLocaleString()}${v.adminRemarks?'<br><b>Remarks:</b> '+esc(v.adminRemarks):''}</div></div><div class="actions">${v.status!=='approved'?`<button class="btn approve" data-id="${esc(v.id)}" data-status="approved">APPROVE & ACTIVATE</button>`:''}<button class="btn" data-id="${esc(v.id)}" data-status="correction_required">CORRECTION REQUIRED</button>${v.status!=='rejected'?`<button class="btn reject" data-id="${esc(v.id)}" data-status="rejected">REJECT</button>`:''}${v.status!=='suspended'?`<button class="btn suspend" data-id="${esc(v.id)}" data-status="suspended">SUSPEND</button>`:''}</div></article>`).join(''):'<div class="empty">No vendors found for this status.</div>'}async function load(){const r=await fetch('/api/admin/vendors',{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok){$('list').innerHTML='<div class="empty">'+esc(d.error||'Unable to load vendors')+'</div>';return}vendors=d.vendors||[];render()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.status;render()});$('list').onclick=async e=>{const b=e.target.closest('[data-id]');if(!b)return;let remarks='';if(b.dataset.status==='rejected'||b.dataset.status==='correction_required'){remarks=prompt(b.dataset.status==='rejected'?'Reason for rejection:':'What must the vendor correct?')||'';if(!remarks.trim())return}else if(!confirm('Change this vendor status to '+label(b.dataset.status)+'?'))return;b.disabled=true;const r=await fetch('/api/admin/vendors/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:b.dataset.id,status:b.dataset.status,remarks})}),d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'Update failed');b.disabled=false;return}await load()};load();</script></body></html>
