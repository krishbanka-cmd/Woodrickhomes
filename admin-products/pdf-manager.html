<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Woodrick Homes | Library PDF Manager</title>
<style>
:root{--black:#050505;--gold:#f0c96b;--cream:#f7f3ec;--line:#ded4c3;--muted:#6d675e;--danger:#a52a2a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:#171717}.wrap{width:min(1100px,92%);margin:auto}.top{background:var(--black);color:#fff;border-bottom:2px solid var(--gold)}.top .wrap{min-height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center;font-weight:900;letter-spacing:2px}.mark{width:44px;height:44px;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;font-size:26px}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:4px;margin-top:3px}.back{color:var(--gold);font-size:12px;font-weight:800;text-decoration:none;border:1px solid var(--gold);padding:9px 11px}.hero{padding:38px 0 18px}.hero h1{font-family:Georgia,serif;font-size:clamp(34px,5vw,52px);font-weight:500;margin:8px 0}.hero p{color:var(--muted);max-width:760px;line-height:1.6}.panel{background:#fff;border:1px solid var(--line);box-shadow:0 18px 48px rgba(0,0,0,.08);padding:24px;margin:18px 0 34px}.controls{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.field{display:grid;gap:8px}label{font-size:12px;font-weight:800;color:#544c3f}input[type=password]{width:100%;padding:13px;border:1px solid #cfc4b2;background:#fff;font:inherit}.btn{border:1px solid var(--gold);padding:12px 16px;font-weight:900;font-size:12px;cursor:pointer}.primary{background:var(--gold);color:#111}.secondary{background:#111;color:var(--gold)}.status{margin-top:16px;padding:13px;background:#f4efe5;border-left:3px solid var(--gold);font-size:13px}.status.error{border-left-color:#b84040;background:#fff0f0}.list{display:grid;gap:10px;margin-top:18px}.item{border:1px solid var(--line);padding:14px;background:#faf8f3;display:flex;justify-content:space-between;gap:14px;align-items:center}.meta{font-size:13px;line-height:1.55}.meta b{font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.download,.attach{border:1px solid #b88b42;background:#fff;color:#6e501a;font-weight:900;font-size:11px;cursor:pointer;padding:9px 11px;text-decoration:none}.attach{background:#111;color:var(--gold)}.missing{color:var(--danger);font-weight:900}.ok{color:#356b35;font-weight:900}@media(max-width:720px){.controls{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.back{font-size:10px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand"><span class="mark">W</span><span>WOODRICK<small>HOMES</small></span></div><a class="back" href="/admin-products/#library">BACK TO LIBRARY</a></div></header>
<section class="hero"><div class="wrap"><h1>Library PDF Manager</h1><p>Add a missing original PDF or replace an existing PDF without converting or changing the JPG pages already saved for that catalogue.</p></div></section>
<main class="wrap"><section class="panel"><div class="controls"><div class="field"><label for="token">LIBRARY UPLOAD CODE</label><input id="token" type="password" placeholder="Enter admin upload code" /></div><button class="btn secondary" id="refresh" type="button">REFRESH CATALOGUES</button></div><div class="status" id="status">Loading library catalogues…</div><div class="list" id="list"></div></section></main>
<input id="pdfInput" type="file" accept="application/pdf" hidden />
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected=null,groups={};
function token(){const v=$('token').value.trim();if(v)sessionStorage.setItem('woodrick_library_token',v);return v||sessionStorage.getItem('woodrick_library_token')||''}
$('token').value=sessionStorage.getItem('woodrick_library_token')||'';
function show(m,e=false){$('status').textContent=m;$('status').className='status'+(e?' error':'')}
async function load(){show('Refreshing catalogue list…');$('refresh').disabled=true;try{const r=await fetch('/api/media?prefix=library/&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Could not load library ('+r.status+')');const d=await r.json();groups={};(d.items||[]).forEach(x=>{const k=[x.brand||'Unknown Brand',x.category||'Other',x.catalogue||'Catalogue'].join('||');groups[k]??={brand:x.brand||'Unknown Brand',category:x.category||'Other',catalogue:x.catalogue||'Catalogue',pdf:null,jpg:[]};if(x.type==='original-pdf')groups[k].pdf=x;else if(x.type==='jpg-page')groups[k].jpg.push(x)});const a=Object.values(groups).sort((x,y)=>x.brand.localeCompare(y.brand)||x.category.localeCompare(y.category)||x.catalogue.localeCompare(y.catalogue));$('list').innerHTML=a.length?a.map(x=>{const k=esc([x.brand,x.category,x.catalogue].join('||'));return `<div class="item"><div class="meta"><b>${esc(x.brand)} → ${esc(x.category)} → ${esc(x.catalogue)}</b><br>${x.jpg.length} JPG pages · ${x.pdf?'<span class="ok">Original PDF available</span>':'<span class="missing">Original PDF missing</span>'}</div><div class="actions">${x.pdf?`<a class="download" href="${x.pdf.url}&download=1">DOWNLOAD PDF</a>`:''}<button class="attach" data-key="${k}" type="button">${x.pdf?'REPLACE PDF':'ADD PDF'}</button></div></div>`}).join(''):'<div class="item">No library catalogues found.</div>';show(`Ready. ${a.length} catalogue${a.length===1?'':'s'} loaded.`)}catch(err){$('list').innerHTML='';show(err.message,true)}finally{$('refresh').disabled=false}}
async function uploadPdf(file,x){const t=token();if(!t)throw Error('Please enter the library upload code.');const fd=new FormData();fd.append('file',file);fd.append('library','1');fd.append('brand',x.brand);fd.append('category',x.category);fd.append('catalogue',x.catalogue);fd.append('title',x.catalogue);fd.append('type','original-pdf');const r=await fetch('/api/upload',{method:'POST',headers:{authorization:'Bearer '+t},body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'PDF upload failed');return d}
$('list').onclick=e=>{const b=e.target.closest('.attach');if(!b)return;selected=groups[b.dataset.key];if(!selected)return;if(selected.pdf&&!confirm(`Replace the existing PDF for ${selected.catalogue}?\n\nThe JPG pages will stay unchanged.`))return;$('pdfInput').value='';$('pdfInput').click()};
$('pdfInput').onchange=async()=>{const f=$('pdfInput').files[0],x=selected;if(!f||!x)return;if(f.type!=='application/pdf'){show('Please choose a PDF file only.',true);return}try{show(`${x.pdf?'Replacing':'Adding'} PDF for ${x.catalogue}…`);await uploadPdf(f,x);show(`Done. Original PDF saved for ${x.catalogue}. JPG pages were not changed.`);await load()}catch(err){show(err.message,true)}finally{selected=null;$('pdfInput').value=''}};
$('refresh').onclick=load;load();
</script>
</body></html>
