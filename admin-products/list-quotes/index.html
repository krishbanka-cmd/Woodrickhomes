<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>List Quotations | Woodrick Homes Admin</title><style>
:root{font-family:Arial,sans-serif;color:#f5f0e6;background:#100f0d}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #64502b;padding:19px max(20px,calc((100vw - 1120px)/2));display:flex;gap:20px;justify-content:space-between;align-items:center}h1{font:normal 30px Georgia,serif;margin:0}a{color:#e3c787}main{max-width:1120px;margin:auto;padding:30px 20px}p{line-height:1.55;color:#c4bcaa}.item{border:1px solid #59492e;background:#191713;margin:18px 0;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.item h2{margin:0 0 10px;font-size:20px;color:#e3c787}.meta{line-height:1.65;color:#d9d2c5}.note{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;flex-direction:column;gap:12px}button,.button{display:inline-block;cursor:pointer;background:#d1aa59;color:#17130c;border:0;border-radius:2px;padding:11px 14px;text-decoration:none;font-weight:bold;width:max-content;max-width:100%;font-size:14px}input[type=file]{max-width:100%;color:#fff}small{color:#ada28d}.status{color:#e3c787}.error{color:#ffac9c}@media(max-width:650px){.item{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><header><h1>Handwritten List Requests</h1><a href="/admin-products/">← Products Admin</a></header><main><p>Customer ki original list dekhein, quotation PDF upload karein, phir WhatsApp button se link bhejein. WhatsApp par message khulne ke baad Send dabana hota hai.</p><button id="refresh" type="button">Refresh requests</button><div id="status" class="status" role="status"></div><div id="items"></div></main><script>
const root=document.getElementById('items'),status=document.getElementById('status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){status.textContent='Loading…';try{const response=await fetch('/api/list-quote',{cache:'no-store'});if(response.status===401){location.href='/admin-products/';return}const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load');root.replaceChildren();for(const item of data.items){const wrap=document.createElement('article');wrap.className='item';const message=`Hello ${item.name}, Woodrick Homes ne aapki material list ke liye quotation banaya hai: ${item.shareUrl||''}`;wrap.innerHTML=`<div><h2>${esc(item.name)} <small>— ${esc(item.status)}</small></h2><div class="meta">📞 ${esc(item.mobile)}<br>📍 ${esc(item.city)}<br>🕒 ${esc(new Date(item.createdAt).toLocaleString('en-IN'))}</div><p class="note">${esc(item.note||'No additional note')}</p></div><div class="actions"><a class="button" target="_blank" rel="noopener" href="${esc(item.originalUrl)}">View original list</a>${item.quoteUrl?`<a class="button" target="_blank" rel="noopener" href="${esc(item.quoteUrl)}">View quotation PDF</a>`:''}<label>Attach quotation PDF (up to 8 MB)<br><input type="file" accept="application/pdf,.pdf" required></label><button class="upload" type="button">Save quotation</button>${item.shareUrl?`<a class="button" target="_blank" rel="noopener" href="https://wa.me/91${esc(item.mobile)}?text=${encodeURIComponent(message)}">Send quote on WhatsApp ↗</a><small>Link holders can view quotation. Uploading a new PDF creates a new link.</small>`:''}<span class="result" role="status"></span></div>`;wrap.querySelector('.upload').onclick=async()=>{const file=wrap.querySelector('input').files[0],result=wrap.querySelector('.result');if(!file||file.type!=='application/pdf'||file.size>8*1024*1024){result.textContent='Select a PDF up to 8 MB';result.className='result error';return}const fd=new FormData();fd.append('id',item.id);fd.append('file',file);result.textContent='Saving…';try{const r=await fetch('/api/list-quote/quote',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Upload failed');await load();status.textContent='Quotation saved. Send it using the WhatsApp button.'}catch(e){result.textContent=e.message;result.className='result error'}};root.append(wrap)}status.textContent=`${data.items.length} request(s)${data.truncated?' — showing recent 100':''}`}catch(e){status.textContent=e.message;status.className='error'}}document.getElementById('refresh').onclick=load;load();
</script></body></html>
