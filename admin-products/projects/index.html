<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Manage Projects | Woodrick Homes</title><style>*{box-sizing:border-box}body{margin:0;background:#101113;color:#eee;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:24px}a{color:#e4c47b}h1,h2{line-height:1.2}button,.button{background:#d6b563;color:#171717;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;font:inherit;display:inline-block}input,textarea,select{display:block;width:100%;background:#202226;color:white;padding:12px;border:1px solid #626262;border-radius:6px;font:inherit}label{display:block;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{border:1px solid #4b4536;background:#191b1e;padding:20px;border-radius:12px;margin:20px 0}img,video{display:block;max-width:100%;max-height:440px;border-radius:8px;margin:12px 0}p{white-space:pre-wrap}.actions{display:flex;gap:12px;flex-wrap:wrap}dialog{color:#eee;background:#101113;width:min(1000px,95vw);max-height:90vh;border:1px solid #d6b563}dialog::backdrop{background:#000b}.muted{color:#ccc}button:disabled{opacity:.5;cursor:wait}</style></head><body><main><a href="/admin-products/">← Admin</a><h1>Completed Projects</h1><p>Create a draft, preview it, then publish when ready.</p><form id="form" class="card"><h2 id="heading">Add project</h2><div class="grid"><label>Project name *<input id="name" required maxlength="150"></label><label>Service / Category<input id="category" placeholder="Kitchen / Wardrobe / Interiors" maxlength="80"></label><label>Location<input id="location" maxlength="150"></label><label>Project done by — Architect / Designer<input id="doneBy" maxlength="150"></label><label>Architecture / Design firm<input id="firm" maxlength="150"></label></div><label>Project description<textarea id="description" rows="3" maxlength="3000"></textarea></label><label>Upload photos and videos<input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"></label><p class="muted">JPG, PNG, WebP, MP4, WebM. Up to 95 MB per save and 30 files per project. For larger videos, compress or upload in separate saves.</p><div id="existing"></div><label><input id="published" type="checkbox" style="display:inline;width:auto"> Publish on website</label><div class="actions"><button id="save">Save project</button><button type="button" id="preview">Preview</button><button type="button" id="reset">New project</button></div></form><p id="status" role="status" aria-live="polite"></p><h2>Saved projects</h2><div id="list"></div><dialog id="dialog"><button id="close" type="button">Close preview</button><div id="previewBody"></div></dialog></main><script>const $=id=>document.getElementById(id);
function node(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}
function render(p){const c=node('article');c.className='card';c.append(node('h2',p.name),node('div',[p.category,p.location].filter(Boolean).join(' · ')));if(p.doneBy)c.append(node('h3','Project done by: '+p.doneBy));if(p.firm)c.append(node('div',p.firm));if(p.description)c.append(node('p',p.description));for(const m of p.media||[]){const e=node(m.type.startsWith('video/')?'video':'img');e.src=m.localUrl||'/api/projects/media?project='+encodeURIComponent(p.id)+'&file='+encodeURIComponent(m.id);if(e.tagName==='VIDEO'){e.controls=true;e.preload='none';e.playsInline=true}else{e.alt=p.name+' — '+m.name;e.loading='lazy'}c.append(e)}return c}
async function api(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}

let current=null,items=[],localUrls=[];
const fields=['name','category','location','description','doneBy','firm'];
function revoke(){localUrls.forEach(URL.revokeObjectURL);localUrls=[]}
function reset(){current=null;HTMLFormElement.prototype.reset.call($('form'));$('existing').replaceChildren();$('heading').textContent='Add project';revoke()}
function edit(p){reset();current=p;for(const k of fields)$(k).value=p[k]||'';$('published').checked=p.published;$('heading').textContent='Edit project';for(const m of p.media){const label=node('label'),check=node('input');check.type='checkbox';check.checked=true;check.value=m.id;check.style='display:inline;width:auto';label.append(check,document.createTextNode(' Keep '+m.name));$('existing').append(label)}window.scrollTo({top:0,behavior:'smooth'})}
function draft(){const p={id:current?.id,media:(current?.media||[]).filter(m=>Array.from($('existing').querySelectorAll('input:checked')).some(c=>c.value===m.id))};for(const k of fields)p[k]=$(k).value.trim();p.published=$('published').checked;return p}
async function load(){const d=await api('/api/projects?admin=1');items=d.items;$('list').replaceChildren();for(const p of items){const c=node('article');c.className='card';c.append(node('h3',p.name),node('p',(p.published?'Published':'Draft')+(p.doneBy?' · Project done by: '+p.doneBy:'')));const actions=node('div');actions.className='actions';for(const [text,fn] of [['Edit',()=>edit(p)],['Preview',()=>preview(p)],['Delete',async()=>{if(!confirm('Delete '+p.name+' and its uploaded media?'))return;try{await api('/api/projects?id='+encodeURIComponent(p.id),{method:'DELETE'});if(current?.id===p.id)reset();await load();$('status').textContent='Project deleted.'}catch(e){$('status').textContent=e.message}}]]){const b=node('button',text);b.type='button';b.onclick=fn;actions.append(b)}c.append(actions);$('list').append(c)}if(!items.length)$('list').append(node('p','No projects yet.'))}
function preview(p){$('previewBody').replaceChildren(render(p));$('dialog').showModal()}
$('preview').onclick=()=>{revoke();const p=draft();for(const f of $('files').files){const url=URL.createObjectURL(f);localUrls.push(url);p.media.push({name:f.name,type:f.type,localUrl:url})}preview(p)};
$('close').onclick=()=>{$('dialog').close();$('previewBody').querySelectorAll('video').forEach(v=>v.pause());revoke()};
$('reset').onclick=reset;
$('form').onsubmit=async e=>{e.preventDefault();const p=draft(),f=new FormData();for(const k of fields)f.set(k,p[k]);if(p.id)f.set('id',p.id);f.set('published',String(p.published));f.set('keep',JSON.stringify(p.media.map(m=>m.id)));for(const file of $('files').files)f.append('files',file);$('save').disabled=true;$('status').textContent='Saving project and uploading files…';try{const d=await api('/api/projects',{method:'POST',body:f});edit(d.project);await load();$('status').textContent=d.project.published?'Saved and published.':'Draft saved. Preview before publishing.'}catch(e){$('status').textContent=e.message}finally{$('save').disabled=false}};
load().catch(e=>$('status').textContent=e.message);
</script></body></html>
