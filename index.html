<script id="woodrick-hero-brand-slider-script">
(function(){
  var slides=Array.prototype.slice.call(document.querySelectorAll('.hero-slide'));
  var dots=Array.prototype.slice.call(document.querySelectorAll('.hero-slide-dot'));
  if(slides.length<2) return;
  var current=0, timer=null, requestId=0;
  function preload(index){
    var slide=slides[index], source=slide.getAttribute('data-hero-src');
    if(!source) return Promise.resolve(true);
    if(slide._heroLoad) return slide._heroLoad;
    slide._heroLoad=new Promise(function(resolve){
      var picture=new Image();
      picture.onload=function(){
        slide.style.setProperty('--hero-image','url("'+source+'")');
        slide.removeAttribute('data-hero-src');
        resolve(true);
      };
      picture.onerror=function(){slide._heroLoad=null;resolve(false)};
      picture.src=source;
    });
    return slide._heroLoad;
  }
  function show(index){
    var target=(index+slides.length)%slides.length, requested=++requestId;
    preload(target).then(function(loaded){
      if(!loaded||requested!==requestId) return;
      current=target;
      var active=slides[current], content=document.querySelector('.hero-content');
      if(content) content.classList.add('is-changing');
      window.setTimeout(function(){
        var kicker=document.getElementById('hero-dynamic-kicker');
        var title=document.getElementById('hero-dynamic-title');
        var accent=document.getElementById('hero-dynamic-accent');
        var copy=document.getElementById('hero-dynamic-copy');
        var link=document.getElementById('hero-dynamic-link');
        if(kicker) kicker.textContent=active.getAttribute('data-kicker')||'PREMIUM BUILDING MATERIALS & INTERIOR SOLUTIONS';
        if(title) title.textContent=active.getAttribute('data-title')||'Everything for';
        if(accent) accent.textContent=active.getAttribute('data-accent')||'Better Spaces.';
        if(copy) copy.textContent=active.getAttribute('data-copy')||'Complete building materials and interior solutions from trusted brands.';
        if(link) link.href=active.getAttribute('data-href')||'/products/';
        if(content) content.classList.remove('is-changing');
      },160);
      slides.forEach(function(slide,i){slide.classList.toggle('is-active',i===current)});
      dots.forEach(function(dot,i){dot.classList.toggle('is-active',i===current);dot.setAttribute('aria-current',i===current?'true':'false')});
      preload((current+1)%slides.length);
    });
  }
  function start(){
    stop();
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||document.hidden) return;
    timer=setInterval(function(){show(current+1)},5200);
  }
  function stop(){if(timer){clearInterval(timer);timer=null}}
  dots.forEach(function(dot){
    dot.addEventListener('click',function(){show(Number(dot.getAttribute('data-hero-slide'))||0);start()});
  });
  var hero=document.querySelector('.hero');
  if(hero){
    hero.addEventListener('mouseenter',stop);
    hero.addEventListener('mouseleave',start);
    hero.addEventListener('focusin',stop);
    hero.addEventListener('focusout',start);
  }
  document.addEventListener('visibilitychange',function(){if(document.hidden) stop(); else start()});
  show(0); start();
})();
</script>

    var card=document.createElement('a');
    card.className='hero-brand-mark';
    card.href='/brands/?brand='+encodeURIComponent(item.brand||item.label||'Brand')+'&return='+encodeURIComponent(location.pathname+location.search+location.hash);
    card.setAttribute('aria-label','View '+(item.label||item.brand||'Brand')+' catalogues, photos and videos');
    card.dataset.brand=item.brand||item.label||'Brand';

    if(item.src){
      var img=document.createElement('img');
      img.src=item.src;
      img.alt=item.alt || ((item.label||item.brand||'Brand')+' logo');
      img.loading='eager';
      img.decoding='async';
      if(item.fallback) img.dataset.fallback=item.fallback;
      img.addEventListener('error',function(){
        if(this.dataset.fallback && !this.dataset.tried){
          this.dataset.tried='1';
          this.src=this.dataset.fallback;
        }else{
          card.classList.add('logo-unavailable');this.style.display='none';
        }
      });
      card.appendChild(img);
    }else{
      card.classList.add('logo-unavailable');
    }

    var label=document.createElement('span');
    label.className='brand-name-fallback';
    label.textContent=item.label||item.brand||'Brand';
    card.appendChild(label);

    var brandKey=String(item.brand||item.label||'').trim().toLowerCase();
    var tagline=item.tagline||item.productLine||item.product_line||item.category||item.description||brandTaglines[brandKey]||'';
    if(tagline){
      var descriptor=document.createElement('span');
      descriptor.className='hero-brand-tagline';
      descriptor.textContent=tagline;
      card.appendChild(descriptor);
    }
    return card;
  }

  function renderHeroBrandRail(items){
    var groups=document.querySelectorAll('.hero-brand-track > .hero-brand-group');
    if(!groups.length)return;
    var list=Array.isArray(items)?items:fallbackBrands;
    window.WOODRICK_BRAND_RAIL=list;
    groups.forEach(function(group,index){
      group.replaceChildren();
      list.forEach(function(item){var card=makeBrandCard(item);if(index>0)card.tabIndex=-1;group.appendChild(card);});
      if(index>0)group.setAttribute('aria-hidden','true');
    });
  }

  async function syncHeroBrandRail(){
    renderHeroBrandRail(fallbackBrands);
    try{
      var r=await fetch('/api/brands?_='+Date.now(),{cache:'no-store',headers:{'cache-control':'no-cache'}});
      if(!r.ok)throw new Error('Brand API '+r.status);
      var d=await r.json();
      if(Array.isArray(d.items))renderHeroBrandRail(d.items);
    }catch(e){
      /* Keep fallback rail visible if API/network is unavailable. */
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',syncHeroBrandRail,{once:true});
  }else{
    syncHeroBrandRail();
  }
})();
</script>
