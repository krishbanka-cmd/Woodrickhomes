<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogues | Woodrick Homes</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#050505;border-bottom:2px solid #f0c96b;padding:16px 5%;display:flex;align-items:center;gap:18px}.back{color:#f0c96b;border:1px solid #f0c96b;padding:10px 14px;text-decoration:none;font-weight:800}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:1px}.brand span{color:#f0c96b}.wrap{width:min(1180px,92%);margin:auto;padding:48px 0 70px}.intro{text-align:center;margin-bottom:28px}.intro small{color:#f0c96b;letter-spacing:3px;font-weight:800}.intro h1{font:500 clamp(36px,5vw,58px)/1.05 Georgia,serif;margin:10px 0}.intro p{color:#bbb}.catalogue-tools{position:sticky;top:79px;z-index:4;background:rgba(11,11,11,.96);backdrop-filter:blur(12px);padding:14px 0 12px;border-bottom:1px solid #2c2c2c}.search{width:min(680px,100%);margin:auto;display:flex;align-items:center;background:#151515;border:1px solid #66583d}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff;padding:14px 16px;font:inherit}.search input::placeholder{color:#8e8e8e}.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 0}.filters button{background:#151515;color:#ddd;border:1px solid #555;padding:9px 13px;cursor:pointer;font-weight:700}.filters button.active{background:#f0c96b;color:#111;border-color:#f0c96b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:22px}.card{min-width:0;background:#151515;border:1px solid #3b3b3b;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 28px rgba(0,0,0,.28);transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#8b7447}.cover{position:relative;isolation:isolate;aspect-ratio:4/3;background:#202020;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #3b3b3b}.cover-bg{position:absolute;z-index:-1;inset:-24px;background-position:center;background-size:cover;filter:blur(18px) brightness(.42) saturate(.8);transform:scale(1.08)}.cover img{display:block;width:100%;height:100%;object-fit:contain;background:transparent;padding:10px}.info{padding:20px;display:flex;flex:1;flex-direction:column}.tag{min-height:28px;font-size:11px;line-height:1.35;color:#f0c96b;text-transform:uppercase;letter-spacing:1px}.info h2{font:500 25px/1.15 Georgia,serif;margin:8px 0;min-height:58px;overflow-wrap:anywhere}.meta{color:#aaa;font-size:13px;min-height:18px;margin-bottom:16px}.actions{margin-top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.actions a{min-height:42px;padding:10px 8px;border:1px solid #f0c96b;color:#f0c96b;text-decoration:none;font-size:11px;line-height:1.2;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center}.actions a.primary{background:#f0c96b;color:#111}.actions a:only-child{grid-column:1/-1}.empty{text-align:center;color:#aaa;padding:60px 10px;grid-column:1/-1}.status{text-align:center;color:#aaa;margin:22px}.skeleton{min-height:420px;background:linear-gradient(100deg,#151515 30%,#222 50%,#151515 70%);background-size:300% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-150% 0}}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.catalogue-tools{top:77px}}@media(max-width:560px){.top{padding:12px 4%}.grid{grid-template-columns:1fr;gap:16px}.brand{font-size:16px}.wrap{padding-top:24px}.info h2{min-height:auto}.tag{min-height:auto}.cover img{padding:8px}.catalogue-tools{top:69px}.filters{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.filters button{white-space:nowrap}}</style></head><body><header class="top"><a class="back" href="/products/">← BACK</a><div class="brand"><span>WOODRICK</span> HOMES · CATALOGUES</div></header><main class="wrap"><section class="intro"><small>WOODRICK HOME LIBRARY</small><h1>Explore Our Catalogues</h1><p>Search by brand, category or catalogue name. View every page or download the original PDF.</p></section><div class="catalogue-tools"><label class="search"><input id="search" type="search" autocomplete="off" placeholder="Search brand, category or catalogue…" aria-label="Search catalogues"></label><div class="filters" id="filters"></div></div><div class="status" id="status">Loading catalogues…</div><section class="grid" id="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section></main><script>const grid=document.getElementById('grid'),filters=document.getElementById('filters'),status=document.getElementById('status'),search=document.getElementById('search');let catalogues=[],active='All',query='';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9.]+/g,' ').trim();const u=(key,extra='')=>'/api/media?'+extra+'key='+encodeURIComponent(key);function friendlyTitle(x,fallback){const source=norm([x.key,x.originalName,x.title,x.catalogue].join(' '));if(source.includes('godrej lock'))return'Godrej Lock Catalogue & Price List';if(source.includes('ipsa'))return'IPSA Hardware Catalogue & Price List';if(source.includes('rainbow'))return'Rainbow Door Skin';if(source.includes('ristal slim')||source.includes('ristal 75'))return'Ristal Slim 0.75mm Laminates';if(source.includes('ristal solid'))return'Ristal Solid Colour 0.92mm';if(source.includes('ristal1mm')||source.includes('ristal 1mm'))return'Ristal 1mm Laminates';if(source.includes('ristal'))return'Ristal 0.82mm Premium Laminates';if(source.includes('mwud'))return'MWUD Futura 0.8mm Laminates';if(source.includes('woodline led'))return'Woodline LED Louvers';if(source.includes('woodline louvers 9'))return'Woodline Louvers 9.5x6';if(source.includes('woodline louvers 8x5'))return"Woodline Louvers 8x5''";if(source.includes('woodline acrylic'))return'Woodline Acrylic';if(source.includes('woodline door'))return'Woodline Door Skin';if(source.includes('woodrick 25'))return'Woodrick Shuttering Plywood 25 KG MR';if(source.includes('woodrick kitchen'))return'Woodrick Kitchen Catalogue';if(source.includes('woodline'))return'Woodline 0.8mm Laminates';return fallback}function group(items){const m=new Map;for(const x of items){const fileName=String(x.originalName||x.title||x.key||''),isPdf=x.type==='pdf'||x.type==='original-pdf'||/\.pdf(?:$|\?)/i.test(fileName);if(x.type!=='jpg-page'&&!isPdf)continue;const rawName=String(x.type==='jpg-page'?(x.catalogue||x.title||x.originalName||''):(x.title||x.catalogue||x.originalName||'')).replace(/\.pdf$/i,'').trim(),name=friendlyTitle(x,rawName);if(!name)continue;let brand=String(x.brand||'Brand').trim()||'Brand';if(/^ristal1mm$/i.test(brand))brand='Ristal';if(/^woodline(?: louvers)?$/i.test(brand))brand='Woodline';if(/^mwud$/i.test(brand))brand='MWUD';if(/^ipsa$/i.test(brand))brand='IPSA';const category=String(x.category||'Catalogue').trim()||'Catalogue',id=[brand,category,name].join('|').toLowerCase();if(!m.has(id))m.set(id,{brand,category,name,pages:[],pdf:null,cover:''});const g=m.get(id);if(x.type==='jpg-page')g.pages.push(x);if(isPdf)g.pdf=x;if(x.coverUrl&&!g.cover)g.cover=x.coverUrl}return[...m.values()].map(g=>(g.pages.sort((a,b)=>Number(a.page||0)-Number(b.page||0)),g)).filter(g=>g.pages.length||g.pdf)}function renderFilters(){const cats=['All',...new Set(catalogues.map(x=>x.category).filter(Boolean))];filters.innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;renderFilters();render()})}function render(){const wanted=norm(query);const list=catalogues.filter(x=>(active==='All'||x.category===active)&&(!wanted||norm([x.brand,x.category,x.name].join(' ')).includes(wanted)));status.textContent=`${list.length} catalogue${list.length===1?'':'s'} found`;grid.innerHTML=list.length?list.map((g,index)=>{const first=g.pages[0],returnTo='/catalogues/',view=g.pdf?u(g.pdf.key,'pdfviewer=1&title='+encodeURIComponent(g.name)+'&return='+encodeURIComponent(returnTo)+'&'):first?u(first.key,'viewer=1&'):'#',cover=first?u(first.key,'raw=1&'):g.cover||'';return`<article class="card"><div class="cover">${cover?`<span class="cover-bg" style="background-image:url(\'${cover}\')" aria-hidden="true"></span><img loading="${index<3?'eager':'lazy'}" decoding="async" ${index===0?'fetchpriority="high"':''} src="${cover}" alt="${esc(g.name)}">`:'CATALOGUE'}</div><div class="info"><div class="tag">${esc(g.category)} · ${esc(g.brand)}</div><h2>${esc(g.name)}</h2><div class="meta">${g.pages.length?g.pages.length+' pages':'PDF catalogue'}</div><div class="actions"><a class="primary" href="${view}">VIEW CATALOGUE</a>${g.pdf?`<a href="${u(g.pdf.key,'download=1&')}">DOWNLOAD PDF</a>`:''}</div></div></article>`}).join(''):'<div class="empty">No matching catalogue found. Try another brand, category or name.</div>'}search.addEventListener('input',()=>{query=search.value;render()});const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));async function fetchMedia(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(url,{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('media '+response.status);const data=await response.json();if(!Array.isArray(data.items))throw new Error('invalid media response');return data.items}finally{clearTimeout(timer)}}async function loadCatalogues(){status.textContent='Loading catalogues…';const sources=['/api/media?catalogue=1','/api/media?prefix=library/','/api/media?catalogue=1&retry='+Date.now()];for(let i=0;i<sources.length;i++){try{const found=group(await fetchMedia(sources[i]));if(found.length){catalogues=found.sort((a,b)=>a.brand.localeCompare(b.brand)||a.name.localeCompare(b.name));renderFilters();render();return}}catch{}if(i<sources.length-1)await wait(700)}grid.innerHTML='<div class="empty">Catalogue connection is taking longer than expected.</div>';status.innerHTML='<button id="retryCatalogues" type="button">RETRY</button>';const retry=document.getElementById('retryCatalogues');if(retry)retry.onclick=loadCatalogues}loadCatalogues()</script></body></html>
