name = "woodrickhomes"
main = "worker-ai.js"
compatibility_date = "2026-08-23"
keep_vars = true

[secrets]
required = ["OPENAI_API_KEY", "ADMIN_UPLOAD_TOKEN"]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "PRODUCT_MEDIA"
bucket_name = "woodrickhomesmedia"
