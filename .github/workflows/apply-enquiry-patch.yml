name: Apply enquiry patch

on:
  push:
    paths:
      - 'scripts/connect_enquiry.py'
      - '.github/workflows/apply-enquiry-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/connect_enquiry.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Connect enquiry form to Google Sheet"
          git push origin HEAD:main
