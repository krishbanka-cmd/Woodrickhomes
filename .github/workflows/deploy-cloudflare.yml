name: Deploy Woodrick Homes to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker*.js'
      - 'wrangler.toml'
      - 'voice-design-assistant.html'
      - 'auto-layout.html'
      - 'auto-layout-result.html'
      - '3d-design-preview.html'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm Node version
        run: node --version

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
