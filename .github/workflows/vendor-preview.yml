name: Deploy Vendor Portal Preview

on:
  push:
    branches: [codex/vendor-portal-review]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated preview storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest r2 bucket create woodrickhomes-vendor-preview || true
          sed -i 's/bucket_name = "woodrickhomesmedia"/bucket_name = "woodrickhomes-vendor-preview"/' wrangler.toml
      - name: Deploy temporary review Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PREVIEW_SESSION_SECRET="$(openssl rand -hex 32)"
          npx --yes wrangler@latest deploy --name woodrickhomes-vendor-preview --var VENDOR_REVIEW_MODE:1 --var VENDOR_SESSION_SECRET:"$PREVIEW_SESSION_SECRET"
