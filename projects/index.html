<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Completed Projects | Woodrick Homes</title><style>*{box-sizing:border-box}body{margin:0;background:#101113;color:#eee;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:24px}a{color:#e4c47b}h1,h2{line-height:1.2}button,.button{background:#d6b563;color:#171717;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;font:inherit;display:inline-block}input,textarea,select{display:block;width:100%;background:#202226;color:white;padding:12px;border:1px solid #626262;border-radius:6px;font:inherit}label{display:block;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{border:1px solid #4b4536;background:#191b1e;padding:20px;border-radius:12px;margin:20px 0}img,video{display:block;max-width:100%;max-height:440px;border-radius:8px;margin:12px 0}p{white-space:pre-wrap}.actions{display:flex;gap:12px;flex-wrap:wrap}dialog{color:#eee;background:#101113;width:min(1000px,95vw);max-height:90vh;border:1px solid #d6b563}dialog::backdrop{background:#000b}.muted{color:#ccc}button:disabled{opacity:.5;cursor:wait}</style></head><body><main><a href="/#products-services">← Services</a><h1>Our Completed Projects</h1><p>Spaces brought to life. Meet the people behind the work.</p><p id="status" role="status">Loading projects…</p><div id="list"></div></main><script>const $=id=>document.getElementById(id);
function node(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}
function render(p){const c=node('article');c.className='card';c.append(node('h2',p.name),node('div',[p.category,p.location].filter(Boolean).join(' · ')));if(p.doneBy)c.append(node('h3','Project done by: '+p.doneBy));if(p.firm)c.append(node('div',p.firm));if(p.description)c.append(node('p',p.description));for(const m of p.media||[]){const e=node(m.type.startsWith('video/')?'video':'img');e.src=m.localUrl||'/api/projects/media?project='+encodeURIComponent(p.id)+'&file='+encodeURIComponent(m.id);if(e.tagName==='VIDEO'){e.controls=true;e.preload='none';e.playsInline=true}else{e.alt=p.name+' — '+m.name;e.loading='lazy'}c.append(e)}return c}
async function api(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
api('/api/projects').then(d=>{$('status').textContent=d.items.length?'':'Project photos and videos will be added soon.';for(const p of d.items)$('list').append(render(p))}).catch(e=>$('status').textContent=e.message);</script></body></html>
