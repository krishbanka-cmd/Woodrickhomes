<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand Media | Woodrick Homes</title>
<style>
:root{--black:#050505;--gold:#f0c96b;--cream:#f7f3ec;--ink:#171717;--muted:#6d675e;--line:#ded4c3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.top{background:var(--black);border-bottom:2px solid var(--gold);color:#fff}.topin,.wrap{width:min(1180px,92%);margin:auto}.topin{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-weight:900;letter-spacing:2px}.logo b{color:var(--gold)}.back{color:var(--gold);border:1px solid var(--gold);padding:10px 13px;text-decoration:none;font-size:11px;font-weight:900}.hero{padding:48px 0 26px}.eyebrow{color:#8b641c;font-size:11px;font-weight:900;letter-spacing:2px}.hero h1{font:500 clamp(38px,6vw,64px) Georgia,serif;margin:9px 0}.hero p{color:var(--muted);line-height:1.65;margin:0}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 24px}.tab{border:1px solid #b88b42;background:#fff;color:#5f461b;padding:12px 16px;font-size:11px;font-weight:900;cursor:pointer}.tab.active{background:#111;color:var(--gold)}.tab[disabled]{opacity:.45;cursor:not-allowed}.status{padding:14px 16px;background:#fff;border-left:3px solid var(--gold);color:var(--muted);font-size:13px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:55px}.card{background:#fff;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.07);overflow:hidden}.preview{height:310px;background:#111;display:grid;place-items:center;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:contain;background:#111}.preview iframe{width:100%;height:100%;border:0;background:#fff}.pdfmark{color:var(--gold);font:900 18px Georgia,serif;letter-spacing:1px}.info{padding:16px}.kind{font-size:9px;color:#8b641c;font-weight:900;letter-spacing:1px}.title{font:500 22px Georgia,serif;margin:7px 0 13px;min-height:50px}.open{display:inline-flex;background:#111;color:var(--gold);border:1px solid var(--gold);padding:11px 14px;text-decoration:none;font-size:10px;font-weight:900}.empty{grid-column:1/-1;padding:45px 22px;text-align:center;background:#fff;border:1px solid var(--line);color:var(--muted)}@media(max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.preview{height:390px}.hero{padding-top:34px}.topin{min-height:64px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="logo"><b>WOODRICK</b> HOMES</div><a class="back" href="/#brands">← BACK TO BRANDS</a></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">BRAND COLLECTION</div><h1 id="brandTitle">Brand</h1><p>Explore available product photos, videos and PDF catalogues from this brand.</p></section><div class="tabs"><button class="tab active" data-type="all">ALL MEDIA</button><button class="tab" data-type="image">PHOTOS <span data-count="image">0</span></button><button class="tab" data-type="video">VIDEOS <span data-count="video">0</span></button><button class="tab" data-type="pdf">PDF CATALOGUES <span data-count="pdf">0</span></button></div><div id="status" class="status">Loading brand media…</div><section id="grid" class="grid"><div class="empty">Loading…</div></section></main>
<script>
(function(){
const params=new URLSearchParams(location.search),requested=(params.get('brand')||'').trim(),title=document.getElementById('brandTitle'),grid=document.getElementById('grid'),status=document.getElementById('status');let items=[],active='all';
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const aliases={'ultratech cement':'ultratech','ultratech building solutions':'ultratech','birla opus paints':'birla opus','griham by supreme':'griham','varmora tiles':'varmora','ristal laminates':'ristal','godrej locks':'godrej','hettich hardware':'hettich','ebco hardware':'ebco','philips lighting':'philips','supreme upvc':'supreme','550d grade steel':'550d'};
const wanted=norm(aliases[norm(requested)]||requested);title.textContent=requested||'Brand Media';document.title=(requested||'Brand Media')+' | Woodrick Homes';
function typeOf(x){const n=String(x.originalName||x.key||'').toLowerCase(),t=String(x.type||'').toLowerCase();if(t==='pdf'||t==='original-pdf'||n.endsWith('.pdf'))return'pdf';if(t==='video'||/\.(mp4|webm|mov)$/.test(n))return'video';return'image'}
function urlOf(x){return x.staticUrl||('/api/media?key='+encodeURIComponent(x.key))}
function belongs(x){const b=norm(x.brand||'');return b===wanted||norm(aliases[b]||b)===wanted}
function render(){const shown=items.filter(x=>active==='all'||typeOf(x)===active);status.textContent=(requested||'Brand')+' · '+shown.length+' '+(active==='all'?'media item':active==='pdf'?'PDF catalogue':active)+(shown.length===1?'':'s');if(!shown.length){grid.innerHTML='<div class="empty">No '+(active==='all'?'photos, videos or PDF catalogues':'items in this section')+' are available for '+esc(requested||'this brand')+' yet.</div>';return}grid.innerHTML=shown.map(x=>{const t=typeOf(x),u=urlOf(x),name=esc(x.catalogue||x.title||x.originalName||'Brand media');let preview=t==='image'?'<img loading="lazy" src="'+u+'" alt="'+name+'">':t==='video'?'<video preload="metadata" controls playsinline src="'+u+'"></video>':'<div class="pdfmark">PDF CATALOGUE</div>';return '<article class="card"><div class="preview">'+preview+'</div><div class="info"><div class="kind">'+(t==='pdf'?'PDF CATALOGUE':t==='video'?'VIDEO':'PHOTO')+'</div><div class="title">'+name+'</div><a class="open" href="'+u+'" '+(t==='pdf'?'':'target="_blank" rel="noopener"')+'>'+(t==='pdf'?'OPEN PDF':t==='video'?'OPEN VIDEO':'OPEN PHOTO')+'</a></div></article>'}).join('')}
function counts(){['image','video','pdf'].forEach(t=>{const n=items.filter(x=>typeOf(x)===t).length,el=document.querySelector('[data-count="'+t+'"]'),button=el&&el.closest('button');if(el)el.textContent=n;if(button)button.disabled=!n})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.disabled)return;active=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
async function load(){try{const r=await fetch('/api/media?brand-page=1&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Media service unavailable');items=(Array.isArray(d.items)?d.items:[]).filter(belongs);if(wanted==='senator'&&!items.some(x=>typeOf(x)==='video'))items.unshift({brand:'Senator',type:'video',title:'Senator Premium Wellness Collection',staticUrl:'/assets/media/senator-showcase.mp4'});counts();render()}catch(e){status.textContent='Unable to load brand media right now.';grid.innerHTML='<div class="empty">Please try again shortly.</div>'}}
load();
})();
</script>
</body></html>
