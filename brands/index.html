<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand Media | Woodrick Homes</title>
<style>
:root{--black:#050505;--gold:#f0c96b;--cream:#f7f3ec;--ink:#171717;--muted:#6d675e;--line:#ded4c3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.top{background:var(--black);border-bottom:2px solid var(--gold);color:#fff}.topin,.wrap{width:min(1180px,92%);margin:auto}.topin{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-weight:900;letter-spacing:2px}.logo b{color:var(--gold)}.back{color:var(--gold);border:1px solid var(--gold);padding:10px 13px;text-decoration:none;font-size:11px;font-weight:900}.hero{padding:48px 0 26px}.eyebrow{color:#8b641c;font-size:11px;font-weight:900;letter-spacing:2px}.hero h1{font:500 clamp(38px,6vw,64px) Georgia,serif;margin:9px 0}.hero p{color:var(--muted);line-height:1.65;margin:0}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 24px}.tab{border:1px solid #b88b42;background:#fff;color:#5f461b;padding:12px 16px;font-size:11px;font-weight:900;cursor:pointer}.tab.active{background:#111;color:var(--gold)}.tab[disabled]{opacity:.45;cursor:not-allowed}.status{padding:14px 16px;background:#fff;border-left:3px solid var(--gold);color:var(--muted);font-size:13px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:55px}.card{background:#fff;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.07);overflow:hidden}.preview{height:310px;background:#111;display:grid;place-items:center;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:contain;background:#111}.preview iframe{width:100%;height:100%;border:0;background:#fff}.pdfmark{color:var(--gold);font:900 18px Georgia,serif;letter-spacing:1px}.info{padding:16px}.kind{font-size:9px;color:#8b641c;font-weight:900;letter-spacing:1px}.title{font:500 22px Georgia,serif;margin:7px 0 13px;min-height:50px}.actions{display:flex;gap:8px;flex-wrap:wrap}.open,.full{display:inline-flex;background:#111;color:var(--gold);border:1px solid var(--gold);padding:11px 14px;text-decoration:none;font:900 10px Arial,sans-serif;cursor:pointer}.full{background:var(--gold);color:#111}.preview:fullscreen,.preview:-webkit-full-screen{width:100vw;height:100vh;background:#000}.preview:fullscreen video,.preview:-webkit-full-screen video{width:100%;height:100%;object-fit:contain}.empty{grid-column:1/-1;padding:45px 22px;text-align:center;background:#fff;border:1px solid var(--line);color:var(--muted)}@media(max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.preview{height:390px}.hero{padding-top:34px}.topin{min-height:64px}}
/* Keep every frame visible while giving portrait video a useful theatre layout. */
.preview.video-preview{height:min(68vh,540px);position:relative;isolation:isolate;background:#141414}
.preview.video-preview:before{content:"";position:absolute;inset:-32px;background:url('/assets/media/senator-poster.webp') center/cover;filter:blur(32px) brightness(.36);transform:scale(1.08);z-index:-1}
.preview.video-preview video{position:relative;width:auto;height:100%;max-width:100%;object-fit:contain;background:transparent;box-shadow:0 0 30px rgba(0,0,0,.45)}
.preview.video-preview:fullscreen,.preview.video-preview:-webkit-full-screen{width:100vw;height:100vh;max-height:none;background:#141414}
.preview.video-preview:fullscreen video,.preview.video-preview:-webkit-full-screen video{width:auto;height:100vh;max-width:100vw;max-height:100vh;object-fit:contain}
@media(max-width:560px){.preview.video-preview{height:min(70vh,540px)}}
.preview{position:relative}.preview .exit-video{position:absolute;z-index:5;top:12px;right:12px;padding:10px 12px;border:1px solid var(--gold);background:rgba(5,5,5,.88);color:var(--gold);font:900 11px Arial,sans-serif;cursor:pointer}.preview:fullscreen .exit-video,.preview:-webkit-full-screen .exit-video{top:22px;right:22px;font-size:14px;padding:13px 17px}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="logo"><b>WOODRICK</b> HOMES</div><a class="back" href="/#brands">← BACK TO BRANDS</a></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">BRAND COLLECTION</div><h1 id="brandTitle">Brand</h1><p>Explore available product photos, videos and PDF catalogues from this brand.</p></section><div class="tabs"><button class="tab active" data-type="all">ALL MEDIA</button><button class="tab" data-type="image">PHOTOS <span data-count="image">0</span></button><button class="tab" data-type="video">VIDEOS <span data-count="video">0</span></button><button class="tab" data-type="pdf">PDF CATALOGUES <span data-count="pdf">0</span></button></div><div id="status" class="status">Loading brand media…</div><section id="grid" class="grid"><div class="empty">Loading…</div></section></main>
<script>
(function(){
const params=new URLSearchParams(location.search),requested=(params.get('brand')||'').trim(),title=document.getElementById('brandTitle'),grid=document.getElementById('grid'),status=document.getElementById('status');let items=[],active='all';
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const aliases={'ultratech cement':'ultratech','ultratech building solutions':'ultratech','birla opus paints':'birla opus','griham by supreme':'griham','varmora tiles':'varmora','ristal laminates':'ristal','godrej locks':'godrej','hettich hardware':'hettich','ebco hardware':'ebco','philips lighting':'philips','supreme upvc':'supreme','550d grade steel':'550d'};
const wanted=norm(aliases[norm(requested)]||requested);title.textContent=requested||'Brand Media';document.title=(requested||'Brand Media')+' | Woodrick Homes';
function typeOf(x){const n=String(x.originalName||x.key||'').toLowerCase(),t=String(x.type||'').toLowerCase();if(t==='pdf'||t==='original-pdf'||n.endsWith('.pdf'))return'pdf';if(t==='video'||/\.(mp4|webm|mov)$/.test(n))return'video';return'image'}
function urlOf(x){if(wanted==='senator'&&typeOf(x)==='video')return '/assets/media/senator-showcase.mp4?v=20260925-layout';return x.staticUrl||('/api/media?key='+encodeURIComponent(x.key))}
function belongs(x){const b=norm(x.brand||'');if(b===wanted||norm(aliases[b]||b)===wanted)return true;return wanted==='ristal'&&typeOf(x)==='pdf'&&/ristal/i.test(String(x.key||'')+' '+String(x.originalName||''))}
const ristalCovers={'ristal.pdf':'/catalogue-covers/ristal-08.webp','ristal-solid-colour.pdf':'/catalogue-covers/ristal-solid.webp','ristal1mm.pdf':'/catalogue-covers/ristal1mm.webp','ristal-slim-75mm.pdf':'/catalogue-covers/ristal-slim.webp'};
function pdfCover(x){const key=String(x.key||'').toLowerCase();for(const [suffix,url] of Object.entries(ristalCovers))if(key.endsWith(suffix))return url;return x.coverUrl||''}
function render(){const shown=items.filter(x=>active==='all'||typeOf(x)===active);status.textContent=(requested||'Brand')+' · '+shown.length+' '+(active==='all'?'media item':active==='pdf'?'PDF catalogue':active)+(shown.length===1?'':'s');if(!shown.length){grid.innerHTML='<div class="empty">No '+(active==='all'?'photos, videos or PDF catalogues':'items in this section')+' are available for '+esc(requested||'this brand')+' yet.</div>';return}grid.innerHTML=shown.map(x=>{const t=typeOf(x),u=urlOf(x),name=esc(x.catalogue||x.title||x.originalName||'Brand media');let preview=t==='image'?'<img loading="lazy" src="'+u+'" alt="'+name+'">':t==='video'?'<video preload="metadata" controls playsinline aria-label="'+name+'" poster="'+(wanted==='senator'?'/assets/media/senator-poster.webp':'')+'" src="'+u+'"></video>':(pdfCover(x)?'<img loading="lazy" src="'+esc(pdfCover(x))+'" alt="'+name+' cover page" onerror="this.outerHTML=\'<div class=&quot;pdfmark&quot;>PDF CATALOGUE</div>\'">':'<div class="pdfmark">PDF CATALOGUE</div>');return '<article class="card"><div class="preview'+(t==='video'&&wanted==='senator'?' video-preview':'')+'">'+preview+(t==='video'?'<button class="exit-video" type="button" aria-label="Exit video and return to previous page">EXIT VIDEO</button>':'')+'</div><div class="info"><div class="kind">'+(t==='pdf'?'PDF CATALOGUE':t==='video'?'VIDEO':'PHOTO')+'</div><div class="title">'+name+'</div><div class="actions">'+(t==='video'?'<button class="open play-video" type="button">PLAY VIDEO</button>':'<a class="open" href="'+u+'" '+(t==='pdf'?'':'target="_blank" rel="noopener"')+'>'+(t==='pdf'?'OPEN PDF':'OPEN PHOTO')+'</a>')+''+(t==='video'?'<button class="full" type="button">FULL SCREEN</button>':'')+'</div></div></article>'}).join('')}
function counts(){['image','video','pdf'].forEach(t=>{const n=items.filter(x=>typeOf(x)===t).length,el=document.querySelector('[data-count="'+t+'"]'),button=el&&el.closest('button');if(el)el.textContent=n;if(button)button.disabled=!n})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.disabled)return;active=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
function returnFromVideo(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});let target='/#brands';try{const previous=new URL(document.referrer);if(previous.origin===location.origin&&previous.pathname+previous.search!==location.pathname+location.search)target=previous.href}catch(_){}location.assign(target)}
grid.addEventListener('ended',event=>{if(event.target.tagName==='VIDEO')returnFromVideo()},true);
grid.addEventListener('click',event=>{if(event.target.closest('.exit-video')){returnFromVideo();return}const play=event.target.closest('.play-video');if(play){play.closest('.card').querySelector('video')?.play();return}const button=event.target.closest('.full');if(!button)return;const preview=button.closest('.card').querySelector('.preview'),video=preview.querySelector('video');if(video&&video.webkitEnterFullscreen){video.webkitEnterFullscreen();return}if(preview.requestFullscreen)preview.requestFullscreen();else if(preview.webkitRequestFullscreen)preview.webkitRequestFullscreen()});
async function load(){try{const r=await fetch('/api/media?brand-page=1&_='+Date.now(),{cache:'no-store'});let d=await r.json();if(!r.ok)throw Error(d.error||'Media service unavailable');let all=Array.isArray(d.items)?d.items:[],seen=new Set();while(d.truncated&&d.cursor&&!seen.has(d.cursor)){seen.add(d.cursor);const next=await fetch('/api/media?cursor='+encodeURIComponent(d.cursor),{cache:'no-store'});if(!next.ok)throw Error('Media service unavailable');d=await next.json();all.push(...(d.items||[]))}items=[...new Map(all.map(x=>[x.key,x])).values()].filter(belongs);if(wanted==='senator'&&!items.some(x=>typeOf(x)==='video'))items.unshift({brand:'Senator',type:'video',title:'Senator Premium Wellness Collection',staticUrl:'/assets/media/senator-showcase.mp4'});counts();render()}catch(e){status.textContent='Unable to load brand media right now.';grid.innerHTML='<div class="empty">Please try again shortly.</div>'}}
load();
})();
</script>
</body></html>
