<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Layout | Woodrick Homes</title><style>:root{--black:#080808;--gold:#f0c96b;--paper:#f7f4ee;--ink:#211b16;--line:#e4ddd2;--muted:#746b62}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.top{background:var(--black);border-bottom:2px solid var(--gold);padding:14px 5%;display:flex;justify-content:space-between}.top a{color:var(--gold);text-decoration:none;font-weight:900;font-size:12px}.wrap{width:min(900px,92%);margin:auto;padding:40px 0 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}.hero{text-align:center}.tick{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin:auto;background:var(--black);color:var(--gold);font-size:28px}.hero h1{font:500 clamp(34px,5vw,50px)/1.1 Georgia,serif;margin:14px 0}.hero p{color:var(--muted);line-height:1.6}.card{margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{padding:14px;background:#fbf8f2;border:1px solid #eee5d9;border-radius:10px}.label{font-size:10px;font-weight:900;color:#8a6b40}.value{margin-top:5px;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{padding:14px 16px;text-decoration:none;font-weight:900;font-size:12px;border-radius:6px;border:1px solid #b78a49}.primary{background:var(--gold);color:#111}.secondary{background:#fff;color:#6e4a1f}@media(max-width:620px){.grid{grid-template-columns:1fr}.actions .btn{width:100%;text-align:center}}</style></head><body><header class="top"><a href="/">WOODRICK HOMES</a><a id="back" href="#">← CHANGE SELECTION</a></header><main class="wrap"><section class="hero"><div class="tick">✓</div><h1>AI recommendation accepted.</h1><p>Your verified Woodrick catalogue selection and room details are ready for the Auto Layout stage.</p></section><section class="card"><div class="grid" id="summary"></div><div class="actions"><a class="btn secondary" id="review" href="#">REVIEW CATALOGUE</a><a class="btn primary" id="next" href="#">CREATE AUTO LAYOUT →</a></div></section></main><script>const q=new URLSearchParams(location.search),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const data=[['ROOM',q.get('roomType')||'Not specified'],['SIZE',(q.get('length')&&q.get('width'))?q.get('length')+' × '+q.get('width')+' ft':'Not specified'],['HEIGHT',q.get('height')?q.get('height')+' ft':'Not specified'],['SELECTED CATALOGUE',(q.get('selectedBrand')?q.get('selectedBrand')+' · ':'')+(q.get('selectedCatalogue')||'Not specified')]];document.getElementById('summary').innerHTML=data.map(x=>`<div class="item"><div class="label">${x[0]}</div><div class="value">${esc(x[1])}</div></div>`).join('');document.getElementById('back').href='/ai-auto-select.html?'+q.toString();document.getElementById('review').href='/catalogues/';const p=new URLSearchParams(q);p.set('autoLayout','1');document.getElementById('next').href='/auto-layout-result.html?'+p.toString();</script></body></html>
